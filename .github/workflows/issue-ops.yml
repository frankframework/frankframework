name: Issue Ops

on:
  issues:
    types:
      - opened

jobs:
  add-to-project:
    name: Add issue to project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/add-to-project@f2c1f1fa649a891be84948ea89b5dfba1526ef05 # v2
        with:
          project-url: https://github.com/orgs/frankframework/projects/2
          github-token: ${{ secrets.ISSUE_OPS }}

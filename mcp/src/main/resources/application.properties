# =============================================================================
# Frank!Framework Management Gateway MCP server - default configuration.
# Every property can be overridden with a --key=value command-line argument, a
# -Dkey=value JVM argument or an environment variable (e.g.
# MANAGEMENT_GATEWAY_HTTP_OUTBOUND_ENDPOINT).
# =============================================================================

# Which MCP transport to expose: stdio (default) or http.
mcp.transport=stdio

# HTTP transport settings (only used when mcp.transport=http).
mcp.http.port=3000
mcp.http.mcpEndpoint=/mcp

# -----------------------------------------------------------------------------
# Management Gateway configuration (mirrors the Frank!Console settings).
# -----------------------------------------------------------------------------
# By default the MCP server reaches a running Frank!Framework over HTTP.
# Alternatives: org.frankframework.management.gateway.HazelcastOutboundGateway
management.gateway.outbound.class=org.frankframework.management.gateway.HttpOutboundGateway

# The management endpoint of the running Frank!Framework instance to connect to.
management.gateway.http.outbound.endpoint=http://localhost:8080/iaf/management

packages:
  - 'console/frontend/src/main/frontend/'
  - 'console/frontend/src/main/frontend/cypress'
allowBuilds:
  '@parcel/watcher': false
  cypress: true
  edgedriver: false
  esbuild: false
  geckodriver: false
  lmdb: false
  msgpackr-extract: false
minimumReleaseAge: 720
overrides:
  diff@>=6.0.0 <8.0.3: '~8.0.4'
  dompurify@<3.4.0: '>=3.4.14'
  serialize-javascript@<7.0.5: '~7.1.0'
  uuid@<14.0.0: '>=14.0.2'
  ws@<8.20.1: '~8.21.3'
minimumReleaseAgeExclude:
  # Renovate security update: pnpm@11.25.0
  - pnpm@11.25.0

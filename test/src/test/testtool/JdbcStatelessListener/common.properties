include = ../global.properties

jdbc.deleteTableIbisTemp.className=org.frankframework.jdbc.FixedQuerySender
jdbc.deleteTableIbisTemp.datasourceName=${jdbc.datasource.default}
jdbc.deleteTableIbisTemp.queryType=other
jdbc.deleteTableIbisTemp.readQuery=DELETE FROM IBISTEMP WHERE TNUMBER=${jdbc.statelesslistener.key}

jdbc.insertTableIbisTemp.className=org.frankframework.jdbc.FixedQuerySender
jdbc.insertTableIbisTemp.datasourceName=${jdbc.datasource.default}
jdbc.insertTableIbisTemp.queryType=other
jdbc.insertTableIbisTemp.readQuery=INSERT INTO IBISTEMP (TKEY, TCHAR, TNUMBER, TVARCHAR) VALUES (SEQ_IBISTEMP.NEXTVAL, '1', ${jdbc.statelesslistener.key}, 'MSG-CID')

jdbc.selectWaitingMessages.className=org.frankframework.jdbc.FixedQuerySender
jdbc.selectWaitingMessages.datasourceName=${jdbc.datasource.default}
jdbc.selectWaitingMessages.readQuery=SELECT * FROM IBISTEMP WHERE TCHAR = '1' AND TNUMBER=${jdbc.statelesslistener.key}
jdbc.selectWaitingMessages.blobSmartGet=true

jdbc.selectProcessedMessages.className=org.frankframework.jdbc.FixedQuerySender
jdbc.selectProcessedMessages.datasourceName=${jdbc.datasource.default}
jdbc.selectProcessedMessages.readQuery=SELECT TCHAR, TVARCHAR FROM IBISTEMP WHERE TCHAR = 'R' AND TNUMBER=${jdbc.statelesslistener.key}
jdbc.selectProcessedMessages.blobSmartGet=true

# Action to wait for single result in one of table-slots
wait.for.db.className=org.frankframework.senders.IbisJavaSender
wait.for.db.serviceName=ibis4test-ManageDatabaseWrapper
wait.for.db.timeout=30000
wait.for.db.param1.name=expectedNumberOfResults
wait.for.db.param1.value=1
wait.for.db.param2.name=numberOfAttempts
wait.for.db.param2.value=30

ignoreContentBetweenKeys1.key1=<rowsupdated>
ignoreContentBetweenKeys1.key2=</rowsupdated>

ignoreContentBetweenKeys2.key1=<field name="TDATE">
ignoreContentBetweenKeys2.key2=</field>

ignoreContentBetweenKeys3.key1=columnDisplaySize="
ignoreContentBetweenKeys3.key2="

ignoreContentBetweenKeys4.key1=<fielddefinition>
ignoreContentBetweenKeys4.key2=</fielddefinition>

ignoreContentBetweenKeys5.key1=<field name="TKEY">
ignoreContentBetweenKeys5.key2=</field>

ignoreContentBetweenKeys6.key1=<field name="TNUMBER">IGNORE
ignoreContentBetweenKeys6.key2=</field>

scenario.description = StatelessJdbcListener scenario 1 - Success

include = common.properties

# clear IbisTemp
step1.jdbc.deleteTableIbisTemp.read = common/DeleteIbistemp.xml

# insert new row
step2.jdbc.insertTableIbisTemp.read = common/InsertIbistemp.xml
jdbc.insertTableIbisTemp.param1.value=good-path

# wait a little for listener to pick up the message
step4.wait.for.db.write = scenario01/wait-till-message-log-request.xml
step5.wait.for.db.read = ignore

# Messages waiting to still be picked up should be none
step6.jdbc.selectWaitingMessages.read = common/result-waiting.xml

# Process messages (original updated by afterProcessedQuery and new record created by FixedQuerySender in transaction)
step7.jdbc.selectProcessedMessages.read = scenario01/result-processed.xml

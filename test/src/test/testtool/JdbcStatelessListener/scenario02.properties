scenario.description = StatelessJdbcListener scenario 2 - Error in Processing

include = common.properties

# clear IbisTemp
step1.jdbc.deleteTableIbisTemp.read = common/DeleteIbistemp.xml

# insert new row
step2.jdbc.insertTableIbisTemp.read = common/InsertIbistemp.xml
jdbc.insertTableIbisTemp.param1.value=error

# wait a little for listener to pick up the message
step4.wait.for.db.write = scenario02/wait-till-message-log-request.xml
step5.wait.for.db.read = ignore

# Messages waiting to still be picked up should be none
step6.jdbc.selectWaitingMessages.read = common/result-waiting.xml

# Messages with error (updated by FixedQuerySender in pipeline in new transaction)
step7.jdbc.selectProcessedMessages.read = scenario02/result-processed.xml

include = ../global.properties

java.MessageQueueSender.className=org.frankframework.senders.FrankSender
java.MessageQueueSender.scope=listener
java.MessageQueueSender.target=JMS/writeMessageQueueListener

jdbc.deleteTableIbisStore.className=org.frankframework.jdbc.FixedQuerySender
jdbc.deleteTableIbisStore.datasourceName=${jdbc.datasource.default}
jdbc.deleteTableIbisStore.queryType=other
jdbc.deleteTableIbisStore.readQuery=DELETE FROM IBISSTORE WHERE SLOTID IN ('TestMessageQueueSenderAndListener-WriteErrors','TestMessageQueueSenderAndListener-WriteLog', 'TestMessageQueueSenderAndListener-ReadLog', 'TestMessageQueueSenderAndListener-ReadErrors', 'TestMessageQueueSenderAndListener-ReadResultLog')

jdbc.selectWriteErrors.className=org.frankframework.jdbc.FixedQuerySender
jdbc.selectWriteErrors.datasourceName=${jdbc.datasource.default}
jdbc.selectWriteErrors.readQuery=SELECT * FROM IBISSTORE WHERE SLOTID = 'TestMessageQueueSenderAndListener-WriteErrors'
jdbc.selectWriteErrors.blobSmartGet=true

jdbc.selectWriteLog.className=org.frankframework.jdbc.FixedQuerySender
jdbc.selectWriteLog.datasourceName=${jdbc.datasource.default}
jdbc.selectWriteLog.readQuery=SELECT * FROM IBISSTORE WHERE SLOTID = 'TestMessageQueueSenderAndListener-WriteLog'
jdbc.selectWriteLog.blobSmartGet=true

jdbc.selectReadLog.className=org.frankframework.jdbc.FixedQuerySender
jdbc.selectReadLog.datasourceName=${jdbc.datasource.default}
jdbc.selectReadLog.queryType = select
jdbc.selectReadLog.readQuery=SELECT * FROM IBISSTORE WHERE SLOTID = 'TestMessageQueueSenderAndListener-ReadLog'
jdbc.selectReadLog.blobSmartGet=true

jdbc.selectReadErrors.className=org.frankframework.jdbc.FixedQuerySender
jdbc.selectReadErrors.datasourceName=${jdbc.datasource.default}
jdbc.selectReadErrors.queryType = select
jdbc.selectReadErrors.readQuery=SELECT * FROM IBISSTORE WHERE SLOTID = 'TestMessageQueueSenderAndListener-ReadErrors'
jdbc.selectReadErrors.blobSmartGet=true

jdbc.selectReadResultLog.className=org.frankframework.jdbc.FixedQuerySender
jdbc.selectReadResultLog.datasourceName=${jdbc.datasource.default}
jdbc.selectReadResultLog.queryType = select
jdbc.selectReadResultLog.readQuery=SELECT * FROM IBISSTORE WHERE SLOTID = 'TestMessageQueueSenderAndListener-ReadResultLog'
jdbc.selectReadResultLog.blobSmartGet=true

java.DelayPipe.className=org.frankframework.senders.IbisJavaSender
java.DelayPipe.serviceName=ibis4test-DelayPipe

ignoreContentBetweenKeys1.key1=<result><rowsupdated>
ignoreContentBetweenKeys1.key2=</rowsupdated></result>


scenario.active=${active.jms}

# All the actions are defined in the common-actions.properties file
include=common-actions.properties

# Test-steps are the same for all tests in this subset, parameterised from the scenarioXX.properties file
step1.jdbc.cleanIbisLog.read=ignore

step2.java.TestTrigger.writeline=${listener.type}-${listener.acknowledgeMode}
step3.java.TestTrigger.readline=${msg.count}

step4.wait.for.db.write=common/wait-for-message-log.xml
step5.wait.for.db.read=ignore

# extra delay to make sure there won't be an extra row in the DB
step6.java.DelayPipe.writeline=dummy
step7.java.DelayPipe.read=ignore

step8.jdbc.countMessageLog.readline=${msg.count}
step9.jdbc.countErrorLog.readline=0

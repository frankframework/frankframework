scenario.active=${active.jms}

# All the actions are defined in the common-actions.properties file
include=common-actions.properties

# Test-steps are the same for all tests in this subset, parameterised from the scenarioXX.properties file

# Clean up from previous tests; output of DELETE query not relevant
step10.jdbc.cleanIbisLog.read=ignore

# Start the test
step20.java.TestTrigger.writeline=${listener.type}-${listener.acknowledgeMode}
step21.java.TestTrigger.readline=${msg.count}

# Wait until all messages are processed
step30.wait.for.db.write=common/wait-for-message-log.xml
step31.wait.for.db.read=ignore

# extra delay to make sure there won't be an extra messages in the DB, which would happen if the same message is processed multiple times
step40.java.DelayPipe.writeline=dummy
step41.java.DelayPipe.read=ignore

# Verify we have correct nr of messages processed and no errors
step50.jdbc.countMessageLog.readline=${msg.count}
step51.jdbc.countErrorLog.readline=0

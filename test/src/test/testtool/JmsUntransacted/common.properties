scenario.active=${active.jms}
include = ../global.properties

java.TestTrigger.className=org.frankframework.senders.FrankSender
java.TestTrigger.scope=adapter
java.TestTrigger.target=JMS/TestJmsUntransacted

jdbc.cleanIbisLog.className=org.frankframework.jdbc.FixedQuerySender
jdbc.cleanIbisLog.datasourceName=${jdbc.datasource.default}
jdbc.cleanIbisLog.queryType=other
jdbc.cleanIbisLog.readQuery=DELETE FROM IBISSTORE WHERE SLOTID LIKE 'JmsUntransacted-%'

jdbc.selectFromMessageLog.className=org.frankframework.jdbc.FixedQuerySender
jdbc.selectFromMessageLog.datasourceName=${jdbc.datasource.default}
jdbc.selectFromMessageLog.queryType = select
jdbc.selectFromMessageLog.readQuery=SELECT * FROM IBISSTORE WHERE SLOTID LIKE 'JmsUntransacted-%'
jdbc.selectFromMessageLog.blobSmartGet=true

jdbc.countMessageLog.className=org.frankframework.jdbc.FixedQuerySender
jdbc.countMessageLog.datasourceName=${jdbc.datasource.default}
jdbc.countMessageLog.queryType = select
jdbc.countMessageLog.readQuery=SELECT COUNT(*) FROM IBISSTORE WHERE TYPE='A' AND SLOTID = ?
jdbc.countMessageLog.scalar=true
jdbc.countMessageLog.param1.name=id

# Action to wait for single result in one of table-slots
wait.for.db.className=org.frankframework.senders.IbisJavaSender
wait.for.db.serviceName=ibis4test-ManageDatabaseWrapper
wait.for.db.timeout=30000
wait.for.db.param1.name=expectedNumberOfResults
wait.for.db.param1.value=1
wait.for.db.param2.name=numberOfAttempts
wait.for.db.param2.value=30

java.DelayPipe.className=org.frankframework.senders.IbisJavaSender
java.DelayPipe.serviceName=ibis4test-DelayPipe

ignoreContentBetweenKeys.RowsUpdated.key1=<result><rowsupdated>
ignoreContentBetweenKeys.RowsUpdated.key2=</rowsupdated></result>

ignoreContentBetweenKeys.ID.key1=<id>
ignoreContentBetweenKeys.ID.key2=</id>

ignoreContentBetweenKeys.FieldDefinitions.key1=<fielddefinition>
ignoreContentBetweenKeys.FieldDefinitions.key2=</fielddefinition>

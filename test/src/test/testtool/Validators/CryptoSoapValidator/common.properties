include = ../../global.properties

soap.sender.className=org.frankframework.http.HttpSender
soap.sender.url=${web.protocol}://${web.host}:${web.port}${web.contextpath}/services/CryptoSoapValidator
soap.sender.authAlias=${framework.api.user.alias}
soap.sender.treatInputMessageAsParameters=true
soap.sender.methodType=POST

soap.crypto.className=org.frankframework.senders.IbisJavaSender
soap.crypto.serviceName=ibis4test-WebServiceSenderCrypto
